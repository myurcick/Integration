services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    entrypoint: ["sh", "-c", "pip install --no-cache-dir psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://orders:$(cat /run/secrets/db_password)@postgres/mlflow --serve-artifacts --artifacts-destination /mlartifacts"]
    secrets: [db_password]
    volumes: [mlartifacts:/mlartifacts]
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    depends_on:
      postgres:
        condition: service_healthy

  trainer:
    build:
      context: .
      dockerfile: training_service/Dockerfile
    profiles: ["train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: house-price
      MODEL_NAME: ${MODEL_NAME:-house-price}
    depends_on: [mlflow, postgres]

  forecast-api:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-house-price}
      MODEL_ALIAS: ${MODEL_ALIAS:-prod}
    depends_on: [mlflow]

  orders-api:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    ports:
      - "${ORDERS_PORT:-8000}:8000"
    environment:
      FORECAST_URL: http://forecast-api:8001
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT:-5.0}
    secrets:
      - db_password
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    environment:
      FORECAST_URL: http://forecast-api:8001
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT:-5.0}
    secrets: [db_password, jwt_secret_key]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  mlartifacts:

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret_key:
    file: ./secrets/jwt_secret_key